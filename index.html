<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор мемов</title>
<style>
  :root {
    --bg: #0f0f12;
    --panel: #1a1a20;
    --panel-2: #23232b;
    --text: #f2f2f5;
    --muted: #9a9aa6;
    --accent: #ffcc00;
    --accent-hover: #ffd633;
    --border: #2e2e38;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .sub {
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 14px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .wrap { padding: 16px 14px 40px; }
    h1 { font-size: 22px; }
    .sub { font-size: 13px; margin-bottom: 16px; }
    .canvas-card { padding: 12px; gap: 12px; }
    .canvas-stage { min-height: 260px; }
    .panel { padding: 14px; }
    textarea { font-size: 16px; }
    input[type="text"], input[type="number"] { font-size: 16px; }
  }
  .canvas-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .canvas-stage {
    width: 100%;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 360px;
    position: relative;
  }
  .canvas-stage.empty {
    background: repeating-linear-gradient(
      45deg,
      #15151a,
      #15151a 10px,
      #1c1c22 10px,
      #1c1c22 20px
    );
    cursor: pointer;
    transition: background 0.15s;
  }
  .canvas-stage.empty:hover,
  .canvas-stage.empty.drag {
    background: rgba(255, 204, 0, 0.06);
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
  }
  .placeholder {
    color: var(--muted);
    text-align: center;
    padding: 40px 20px;
    font-size: 14px;
    line-height: 1.5;
  }
  .placeholder strong {
    color: var(--accent);
    display: block;
    font-size: 16px;
    margin-bottom: 8px;
  }
  canvas {
    max-width: 100%;
    height: auto;
    display: block;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  input[type="text"], input[type="number"], textarea {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
  }
  textarea {
    resize: vertical;
    min-height: 60px;
    font-family: "Times New Roman", Times, serif;
    font-weight: 700;
  }
  input[type="range"] {
    width: 100%;
  }
  .file-drop {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    color: var(--muted);
    font-size: 13px;
  }
  .file-drop:hover, .file-drop.drag {
    border-color: var(--accent);
    background: rgba(255, 204, 0, 0.04);
    color: var(--text);
  }
  .file-drop input { display: none; }
  .btn {
    background: var(--accent);
    color: #1a1a20;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled {
    background: var(--panel-2);
    color: var(--muted);
    cursor: not-allowed;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--accent); background: rgba(255, 204, 0, 0.04); }
  .row {
    display: flex;
    gap: 10px;
  }
  .row > * { flex: 1; }
  .field-inline {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .field-inline input[type="range"] { flex: 1; }
  .value { color: var(--text); min-width: 36px; text-align: right; }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 30px;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Генератор мемов</h1>
  <div class="sub">Загрузите фото, добавьте текст сверху и снизу — скачайте готовый мем.</div>

  <div class="layout">
    <div class="canvas-card">
      <div class="canvas-stage empty" id="stage">
        <div class="placeholder" id="placeholder">
          <strong>Нажмите, чтобы загрузить фото</strong>
          или перетащите файл сюда
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
      </div>
      <div class="row" style="width:100%; max-width: 420px;">
        <button class="btn" id="downloadBtn" disabled>Скачать мем</button>
        <button class="btn btn-ghost" id="resetBtn" disabled>Сбросить</button>
      </div>
    </div>

    <div class="panel">
      <label class="file-drop" id="dropZone">
        <strong>Выбрать изображение</strong>
        <div style="margin-top:6px;">или перетащите файл сюда</div>
        <input type="file" id="fileInput" accept="image/*">
      </label>

      <div class="divider"></div>

      <label>
        Текст сверху
        <textarea id="topText" placeholder="ВЕРХНИЙ ТЕКСТ" rows="2"></textarea>
      </label>

      <label>
        Текст снизу
        <textarea id="bottomText" placeholder="НИЖНИЙ ТЕКСТ" rows="2"></textarea>
      </label>

      <div class="divider"></div>

      <div class="field-inline">
        <span>Размер</span>
        <input type="range" id="fontSize" min="20" max="120" value="56">
        <span class="value" id="fontSizeVal">56</span>
      </div>

      <div class="field-inline">
        <span>Обводка</span>
        <input type="range" id="strokeWidth" min="1" max="20" value="6">
        <span class="value" id="strokeWidthVal">6</span>
      </div>

      <label style="flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px;">
        <input type="checkbox" id="uppercase" checked>
        Заглавные буквы
      </label>
    </div>
  </div>

  <footer>
    Шрифт: Times New Roman, белый с чёрной обводкой.
  </footer>
</div>

<script>
(function() {
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const stage = document.getElementById('stage');
  const placeholder = document.getElementById('placeholder');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const topText = document.getElementById('topText');
  const bottomText = document.getElementById('bottomText');
  const fontSize = document.getElementById('fontSize');
  const fontSizeVal = document.getElementById('fontSizeVal');
  const strokeWidth = document.getElementById('strokeWidth');
  const strokeWidthVal = document.getElementById('strokeWidthVal');
  const uppercase = document.getElementById('uppercase');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');

  let img = null;

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('Пожалуйста, выберите файл изображения.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const newImg = new Image();
      newImg.onload = () => {
        img = newImg;
        const maxDim = 1200;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          const k = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * k);
          h = Math.round(h * k);
        }
        canvas.width = w;
        canvas.height = h;
        canvas.style.display = 'block';
        placeholder.style.display = 'none';
        stage.classList.remove('empty');
        downloadBtn.disabled = false;
        resetBtn.disabled = false;
        render();
      };
      newImg.onerror = () => alert('Не удалось загрузить изображение. Возможно, формат не поддерживается браузером (например, AVIF в старых браузерах).');
      newImg.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function wrapLines(text, maxWidth) {
    const words = text.split(/\s+/).filter(Boolean);
    const lines = [];
    let current = '';
    for (const w of words) {
      const test = current ? current + ' ' + w : w;
      if (ctx.measureText(test).width <= maxWidth) {
        current = test;
      } else {
        if (current) lines.push(current);
        if (ctx.measureText(w).width > maxWidth) {
          let chunk = '';
          for (const ch of w) {
            if (ctx.measureText(chunk + ch).width <= maxWidth) {
              chunk += ch;
            } else {
              if (chunk) lines.push(chunk);
              chunk = ch;
            }
          }
          current = chunk;
        } else {
          current = w;
        }
      }
    }
    if (current) lines.push(current);
    return lines;
  }

  function drawText(text, position) {
    if (!text) return;
    const value = uppercase.checked ? text.toUpperCase() : text;
    const size = parseInt(fontSize.value, 10);
    const stroke = parseInt(strokeWidth.value, 10);
    const padding = Math.round(size * 0.3);
    const maxWidth = canvas.width - padding * 2;

    ctx.font = `bold ${size}px "Times New Roman", Times, serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = position === 'top' ? 'top' : 'bottom';
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = stroke;
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;

    const lines = [];
    for (const line of value.split('\n')) {
      lines.push(...wrapLines(line, maxWidth));
    }

    const lineHeight = size * 1.05;
    const x = canvas.width / 2;
    if (position === 'top') {
      lines.forEach((line, i) => {
        const y = padding + i * lineHeight;
        ctx.strokeText(line, x, y);
        ctx.fillText(line, x, y);
      });
    } else {
      const total = lines.length;
      lines.forEach((line, i) => {
        const y = canvas.height - padding - (total - 1 - i) * lineHeight;
        ctx.strokeText(line, x, y);
        ctx.fillText(line, x, y);
      });
    }
  }

  function render() {
    if (!img) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    drawText(topText.value, 'top');
    drawText(bottomText.value, 'bottom');
  }

  fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('drag');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  stage.addEventListener('click', () => {
    if (!img) fileInput.click();
  });
  stage.addEventListener('dragover', (e) => {
    e.preventDefault();
    stage.classList.add('drag');
  });
  stage.addEventListener('dragleave', () => stage.classList.remove('drag'));
  stage.addEventListener('drop', (e) => {
    e.preventDefault();
    stage.classList.remove('drag');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  [topText, bottomText].forEach(el => el.addEventListener('input', render));
  [fontSize, strokeWidth].forEach(el => el.addEventListener('input', () => {
    fontSizeVal.textContent = fontSize.value;
    strokeWidthVal.textContent = strokeWidth.value;
    render();
  }));
  uppercase.addEventListener('change', render);

  downloadBtn.addEventListener('click', () => {
    if (!img) return;
    const link = document.createElement('a');
    link.download = 'meme.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  resetBtn.addEventListener('click', () => {
    img = null;
    canvas.style.display = 'none';
    placeholder.style.display = 'block';
    stage.classList.add('empty');
    topText.value = '';
    bottomText.value = '';
    fileInput.value = '';
    downloadBtn.disabled = true;
    resetBtn.disabled = true;
  });
})();
</script>
</body>
</html>
