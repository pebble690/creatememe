<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Генератор мемов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f5f5f7;
    --panel-2: #ebebef;
    --text: #1a1a20;
    --muted: #6b6b75;
    --accent: #1a1a20;
    --accent-hover: #2d2d35;
    --accent-text: #ffffff;
    --border: #e2e2e6;
    --stage-bg: #f0f0f3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    /* фон под safe-area, чтобы при overscroll/notch не было белой полосы */
    background: var(--bg);
    height: 100%;
    -webkit-text-size-adjust: 100%;
    /* manipulation = убирает двойной тап = зум, но оставляет pinch (a11y) */
    touch-action: manipulation;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: contain;
    touch-action: manipulation;
  }
  body {
    /* Safe-area на уровне body — нужна в Safari/обычном браузере, чтобы контент
       не залезал под чёлку / Dynamic Island / home-indicator.
       В Telegram эти insets обычно = 0, но close-button / меню Mini App
       на современных клиентах рендерятся ПОВЕРХ WebView, поэтому ниже
       для html.in-telegram добавляем гарантированный буфер. */
    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
  }
  /* Mini App: для СТАРЫХ Telegram-клиентов (нет contentSafeAreaInset API)
     резервируем 64px на случай плавающей close-кнопки. */
  html.in-telegram body {
    padding-top: max(env(safe-area-inset-top), var(--tg-top, 0px), 64px);
    padding-bottom: max(env(safe-area-inset-bottom), var(--tg-bottom, 0px), 12px);
  }
  /* НОВЫЙ Telegram (Bot API 8.0+) рапортует contentSafeAreaInset — доверяем ему
     и снимаем 64px-фолбэк. Это критично на Android: в режиме "открыто из чата
     бота" Telegram рисует title-bar над WebView, contentSafeAreaInset = 0,
     и 64px превращается в мёртвое пространство. В режиме "из списка чатов"
     close-кнопка плавает поверх, contentSafeAreaInset вернёт ~60px — будем
     корректно её обходить. Минимум 12px на визуальный отступ. */
  html.in-telegram.tg-knows-safe-area body {
    padding-top: max(env(safe-area-inset-top), var(--tg-top, 0px), 12px);
  }
  /* На Android из списка чатов overlay-кнопка визуально сидит ниже, поэтому
     +30% к рапортованному значению. В chat-launch режиме --tg-top = 0,
     множитель ничего не ломает. */
  html.in-telegram.tg-knows-safe-area.tg-android body {
    padding-top: max(env(safe-area-inset-top), calc(var(--tg-top, 0px) * 1.3), 12px);
  }
  /* На iOS оставляем как было — пользователь говорит, всё ок.
     Снизу режем env(safe-area-inset-bottom) на 30%. */
  html.in-telegram.tg-ios body {
    padding-top: max(env(safe-area-inset-top), var(--tg-top, 0px), 100px);
    padding-bottom: max(calc(env(safe-area-inset-bottom) * 0.7), 8px);
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .sub {
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 14px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .wrap {
      padding: 16px 14px 40px;
    }
    h1 { font-size: 22px; }
    .sub { font-size: 13px; margin-bottom: 16px; }
    .canvas-card { padding: 12px; gap: 12px; }
    .canvas-stage { min-height: 260px; }
    .panel { padding: 14px; }
    textarea { font-size: 16px; }
    input[type="text"], input[type="number"] { font-size: 16px; }
    footer {
      margin-top: 24px;
      padding-bottom: env(safe-area-inset-bottom);
    }
  }
  /* Ландшафт — компактнее */
  @media (orientation: landscape) and (max-height: 500px) {
    .wrap { padding: 12px 14px; }
    h1 { font-size: 20px; margin-bottom: 0; }
    .sub { margin-bottom: 12px; }
  }
  .canvas-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .canvas-stage {
    width: 100%;
    background: var(--stage-bg);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 360px;
    position: relative;
  }
  .canvas-stage.empty {
    background:
      repeating-linear-gradient(
        45deg,
        #f0f0f3,
        #f0f0f3 10px,
        #e7e7eb 10px,
        #e7e7eb 20px
      );
    cursor: pointer;
    transition: background 0.15s;
  }
  .canvas-stage.empty:hover,
  .canvas-stage.empty.drag {
    background: #f7f7fa;
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
  }
  .placeholder {
    color: var(--muted);
    text-align: center;
    padding: 40px 20px;
    font-size: 14px;
    line-height: 1.5;
  }
  .placeholder strong {
    color: var(--text);
    display: block;
    font-size: 16px;
    margin-bottom: 8px;
  }
  canvas {
    max-width: 100%;
    height: auto;
    display: block;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  input[type="text"], input[type="number"], textarea {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
  }
  textarea {
    resize: vertical;
    min-height: 60px;
    font-family: Impact, "Anton", "Arial Black", sans-serif;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  input[type="range"] {
    width: 100%;
  }
  .btn {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled {
    background: var(--panel-2);
    color: var(--muted);
    cursor: not-allowed;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--accent); background: #fafafa; }
  .row {
    display: flex;
    gap: 10px;
  }
  .row > * { flex: 1; }
  .field-inline {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .field-inline input[type="range"] { flex: 1; }
  .value { color: var(--text); min-width: 36px; text-align: right; }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 30px;
  }
  footer a { color: var(--muted); }
  .version {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + max(env(safe-area-inset-bottom), var(--tg-bottom, 0px)));
    transform: translateX(-50%) translateY(20px);
    background: #1a1a20;
    color: #ffffff;
    border: 1px solid #1a1a20;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    max-width: calc(100% - 32px);
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Генератор мемов</h1>
  <div class="sub">Загрузите фото, добавьте текст сверху и снизу — скачайте готовый мем.</div>

  <div class="layout">
    <div class="canvas-card">
      <div class="canvas-stage empty" id="stage">
        <div class="placeholder" id="placeholder">
          <strong>Нажмите, чтобы загрузить фото</strong>
          или перетащите файл сюда
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
      </div>
      <div class="row" style="width:100%; max-width: 420px;">
        <button class="btn" id="downloadBtn" disabled>Скачать мем</button>
        <button class="btn btn-ghost" id="resetBtn" disabled>Сбросить</button>
      </div>
    </div>

    <div class="panel">
      <input type="file" id="fileInput" accept="image/*" style="display:none;">

      <label>
        Текст сверху
        <textarea id="topText" placeholder="ВЕРХНИЙ ТЕКСТ" rows="2"></textarea>
      </label>

      <label>
        Текст снизу
        <textarea id="bottomText" placeholder="НИЖНИЙ ТЕКСТ" rows="2"></textarea>
      </label>

      <div class="divider"></div>

      <div class="field-inline">
        <span>Размер</span>
        <input type="range" id="fontSize" min="20" max="120" value="56">
        <span class="value" id="fontSizeVal">56</span>
      </div>

      <div class="field-inline">
        <span>Обводка</span>
        <input type="range" id="strokeWidth" min="1" max="20" value="6">
        <span class="value" id="strokeWidthVal">6</span>
      </div>

      <label style="flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px;">
        <input type="checkbox" id="uppercase" checked>
        Заглавные буквы
      </label>
    </div>
  </div>

  <footer>
    Шрифт: Impact, белый с чёрной обводкой.
    <span class="version">v1.0.11</span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function() {
  // --- Telegram Mini App: разворачиваем на полный экран ---
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    // Маркируем <html>, чтобы CSS зарезервировал отступ под плавающие
    // кнопки Telegram (close, меню) которые наезжают поверх WebView.
    document.documentElement.classList.add('in-telegram');
    if (tg.platform) {
      document.documentElement.classList.add('tg-' + tg.platform);
    }

    try { tg.ready(); } catch (e) {}
    // expand() — занять всю доступную высоту (Bot API 6.1+).
    // Работает и при открытии из чата, и из списка чатов.
    try { tg.expand(); } catch (e) {}

    // disableVerticalSwipes() — Bot API 7.7+: блокирует свайп вниз,
    // которым по умолчанию можно свернуть/закрыть Mini App.
    if (typeof tg.disableVerticalSwipes === 'function') {
      try { tg.disableVerticalSwipes(); } catch (e) {}
    }

    // requestFullscreen() намеренно НЕ вызываем: в этом режиме close-button и
    // 3-точки Telegram наезжают на наш контент, а compensation через
    // contentSafeAreaInset работает только на Bot API 8.0+ (ноябрь 2024).
    // expand() даёт максимальную высоту, оставляя нативный хедер Telegram сверху —
    // это и есть надёжный «развернуть на весь экран».

    // Подгоняем цвета хедера/фона Telegram под страницу.
    try { tg.setHeaderColor && tg.setHeaderColor('#ffffff'); } catch (e) {}
    try { tg.setBackgroundColor && tg.setBackgroundColor('#ffffff'); } catch (e) {}

    // Если по какой-то причине вьюпорт «схлопнется» (юзер свайпнул, старый клиент) —
    // принудительно разворачиваем обратно.
    try {
      tg.onEvent && tg.onEvent('viewportChanged', (e) => {
        if (e && e.isStateStable && tg.isExpanded === false) {
          try { tg.expand(); } catch (err) {}
        }
      });
    } catch (e) {}

    // Telegram safe-area: Bot API 8.0+ отдаёт contentSafeAreaInset/safeAreaInset
    // с актуальными значениями для текущего режима (overlay close-кнопка
    // vs нативный title-bar над WebView). Если API доступен — навешиваем
    // .tg-knows-safe-area, и CSS перестаёт применять жёсткий 64px-фолбэк.
    function applyTgSafeArea() {
      if (!tg) return;
      const csa = tg.contentSafeAreaInset;
      const sa  = tg.safeAreaInset;
      const hasApi = (csa && typeof csa.top === 'number') ||
                     (sa  && typeof sa.top  === 'number');
      const root = document.documentElement;
      if (!hasApi) {
        // Старый клиент — оставляем дефолтный 64px-фолбэк из CSS
        root.classList.remove('tg-knows-safe-area');
        return;
      }
      root.classList.add('tg-knows-safe-area');
      const num = (v) => (typeof v === 'number' && !isNaN(v) ? v : 0);
      const top    = Math.max(num(csa && csa.top),    num(sa && sa.top));
      const bottom = Math.max(num(csa && csa.bottom), num(sa && sa.bottom));
      const left   = Math.max(num(csa && csa.left),   num(sa && sa.left));
      const right  = Math.max(num(csa && csa.right),  num(sa && sa.right));
      const r = root.style;
      r.setProperty('--tg-top',    top    + 'px');
      r.setProperty('--tg-bottom', bottom + 'px');
      r.setProperty('--tg-left',   left   + 'px');
      r.setProperty('--tg-right',  right  + 'px');
    }
    applyTgSafeArea();
    ['safeAreaChanged','contentSafeAreaChanged','fullscreenChanged','viewportChanged'].forEach((ev) => {
      try { tg.onEvent && tg.onEvent(ev, applyTgSafeArea); } catch (e) {}
    });
  }

  const fileInput = document.getElementById('fileInput');
  const stage = document.getElementById('stage');
  const placeholder = document.getElementById('placeholder');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const topText = document.getElementById('topText');
  const bottomText = document.getElementById('bottomText');
  const fontSize = document.getElementById('fontSize');
  const fontSizeVal = document.getElementById('fontSizeVal');
  const strokeWidth = document.getElementById('strokeWidth');
  const strokeWidthVal = document.getElementById('strokeWidthVal');
  const uppercase = document.getElementById('uppercase');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');

  let img = null;

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('Пожалуйста, выберите файл изображения.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const newImg = new Image();
      newImg.onload = () => {
        img = newImg;
        const maxDim = 1200;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          const k = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * k);
          h = Math.round(h * k);
        }
        canvas.width = w;
        canvas.height = h;
        canvas.style.display = 'block';
        placeholder.style.display = 'none';
        stage.classList.remove('empty');
        downloadBtn.disabled = false;
        resetBtn.disabled = false;
        render();
      };
      newImg.onerror = () => alert('Не удалось загрузить изображение. Возможно, формат не поддерживается браузером (например, AVIF в старых браузерах).');
      newImg.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function wrapLines(text, maxWidth) {
    const words = text.split(/\s+/).filter(Boolean);
    const lines = [];
    let current = '';
    for (const w of words) {
      const test = current ? current + ' ' + w : w;
      if (ctx.measureText(test).width <= maxWidth) {
        current = test;
      } else {
        if (current) lines.push(current);
        if (ctx.measureText(w).width > maxWidth) {
          let chunk = '';
          for (const ch of w) {
            if (ctx.measureText(chunk + ch).width <= maxWidth) {
              chunk += ch;
            } else {
              if (chunk) lines.push(chunk);
              chunk = ch;
            }
          }
          current = chunk;
        } else {
          current = w;
        }
      }
    }
    if (current) lines.push(current);
    return lines;
  }

  function drawText(text, position) {
    if (!text) return;
    const value = uppercase.checked ? text.toUpperCase() : text;
    const size = parseInt(fontSize.value, 10);
    const stroke = parseInt(strokeWidth.value, 10);
    const sidePadding = Math.round(size * 0.3);
    const edgePadding = Math.round(size * 0.7);
    const maxWidth = canvas.width - sidePadding * 2;

    // bold нужен явно: на Android Impact не установлен системно, fallback Anton —
    // single-weight (400), без явного веса браузер не утолщает → текст выходит
    // тонким. С 'bold' либо находим bold-face, либо браузер faux-bold'нёт fallback.
    ctx.font = `bold ${size}px Impact, "Anton", "Arial Black", "Helvetica Neue", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = position === 'top' ? 'top' : 'bottom';
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = stroke;
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;

    const lines = [];
    for (const line of value.split('\n')) {
      lines.push(...wrapLines(line, maxWidth));
    }

    const lineHeight = size * 1.05;
    const x = canvas.width / 2;
    if (position === 'top') {
      lines.forEach((line, i) => {
        const y = edgePadding + i * lineHeight;
        ctx.strokeText(line, x, y);
        ctx.fillText(line, x, y);
      });
    } else {
      const total = lines.length;
      lines.forEach((line, i) => {
        const y = canvas.height - edgePadding - (total - 1 - i) * lineHeight;
        ctx.strokeText(line, x, y);
        ctx.fillText(line, x, y);
      });
    }
  }

  function render() {
    if (!img) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    drawText(topText.value, 'top');
    drawText(bottomText.value, 'bottom');
  }

  fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });

  stage.addEventListener('click', () => {
    fileInput.click();
  });
  stage.addEventListener('dragover', (e) => {
    e.preventDefault();
    stage.classList.add('drag');
  });
  stage.addEventListener('dragleave', () => stage.classList.remove('drag'));
  stage.addEventListener('drop', (e) => {
    e.preventDefault();
    stage.classList.remove('drag');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  [topText, bottomText].forEach(el => el.addEventListener('input', render));
  [fontSize, strokeWidth].forEach(el => el.addEventListener('input', () => {
    fontSizeVal.textContent = fontSize.value;
    strokeWidthVal.textContent = strokeWidth.value;
    render();
  }));
  uppercase.addEventListener('change', render);

  // Перерисовываем после загрузки веб-шрифта Anton, чтобы canvas обновился,
  // если первый рендер прошёл с системным фолбэком.
  if (document.fonts && document.fonts.ready) {
    // Принудительный запрос на bold-вариант Anton — без явной загрузки браузер
    // может никогда не подтянуть шрифт, если canvas не дёрнут вовремя.
    if (typeof document.fonts.load === 'function') {
      document.fonts.load('bold 16px Anton').catch(() => {});
    }
    document.fonts.ready.then(() => { if (img) render(); });
  }

  const toast = document.getElementById('toast');
  let toastTimer = null;
  function showToast(text, ms = 4000) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), ms);
  }

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function isAndroid() {
    return /Android/i.test(navigator.userAgent);
  }
  function isMobile() {
    return isIOS() || isAndroid();
  }

  // --- Service Worker для скачивания в Android-WebView Telegram ---
  // SW регистрируется заранее, чтобы к моменту нажатия кнопки он уже был активен.
  // Логика: blob кладётся в SW через postMessage, потом мы переходим по
  // same-origin URL /_dl/<id>/<filename>, SW отвечает с Content-Disposition: attachment —
  // и system download manager забирает файл штатно.
  let swReadyPromise = null;
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    swReadyPromise = navigator.serviceWorker.register('sw.js')
      .then(() => navigator.serviceWorker.ready)
      .then(() => {
        if (navigator.serviceWorker.controller) {
          return navigator.serviceWorker.controller;
        }
        return new Promise((resolve) => {
          const timer = setTimeout(() => resolve(null), 3000);
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            clearTimeout(timer);
            resolve(navigator.serviceWorker.controller);
          }, { once: true });
        });
      })
      .catch(() => null);
  }

  async function prepareSWDownload(blob, fileName) {
    if (!swReadyPromise) return null;
    const controller = await swReadyPromise;
    if (!controller) return null;
    const id = (crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : (Date.now().toString(36) + Math.random().toString(36).slice(2));
    controller.postMessage({ type: 'cache-download', id, blob, fileName });
    return new URL('_dl/' + id + '/' + encodeURIComponent(fileName), location.href).href;
  }

  // --- Загрузка blob на временный публичный хост ---
  // Нужно для Android-WebView Telegram, который полностью блокирует
  // download через blob:/SW. Получив HTTPS-URL, мы можем дёрнуть
  // tg.downloadFile (Bot API 8.0+, нативный диалог сохранения) или
  // tg.openLink — система откроет картинку в Chrome, оттуда штатное «Сохранить в Фото».
  // Используем tmpfiles.org с TTL 1 час → картинка автоматически удаляется.
  async function uploadToTempHost(blob, fileName) {
    try {
      const fd = new FormData();
      fd.append('file', blob, fileName);
      const r = await fetch('https://tmpfiles.org/api/v1/upload', {
        method: 'POST',
        body: fd,
      });
      if (!r.ok) throw new Error('tmpfiles ' + r.status);
      const j = await r.json();
      const u = j && j.data && j.data.url;
      if (!u) throw new Error('no url');
      // tmpfiles отдаёт viewer-URL вида https://tmpfiles.org/12345/name.png,
      // direct-download URL — через /dl/.
      return u.replace('://tmpfiles.org/', '://tmpfiles.org/dl/');
    } catch (e) {
      console.warn('tmpfiles upload failed', e);
      return null;
    }
  }

  function canvasToBlob() {
    return new Promise((resolve, reject) => {
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png');
    });
  }

  async function saveMeme() {
    if (!img) return;
    const originalLabel = downloadBtn.textContent;
    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Готовим…';
    try {
      const blob = await canvasToBlob();
      const fileName = `meme-${Date.now()}.png`;
      const file = new File([blob], fileName, { type: 'image/png' });

      // 1) Web Share API с файлом — лучший путь на iOS/Android и в WebView Telegram:
      //    открывается нативная "шторка поделиться" → "Сохранить изображение" → Фото/Галерея.
      //    НЕ гейтим через canShare: в Android-WebView Telegram он часто возвращает false,
      //    хотя сам share() при этом отрабатывает корректно. Доверяем try/catch.
      if (navigator.share) {
        try {
          await navigator.share({ files: [file], title: 'Мем' });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return; // пользователь закрыл шторку
          // share не поддержан с файлами → падаем в фолбэк
        }
      }

      // 2) Мобильный путь. Android Telegram WebView полностью блокирует
      //    download (и blob:, и SW-проксирование через DownloadListener).
      //    Заливаем blob на временный публичный хост (TTL 1 час) и отдаём
      //    готовый HTTPS-URL: tg.downloadFile() покажет нативный диалог
      //    сохранения, либо tg.openLink() откроет в системном Chrome.
      if (isMobile()) {
        downloadBtn.textContent = 'Загружаем…';
        const hostedUrl = await uploadToTempHost(blob, fileName);

        if (hostedUrl) {
          // 2a) Bot API 8.0+ — нативный download-диалог Telegram → галерея.
          if (tg && typeof tg.downloadFile === 'function') {
            try {
              tg.downloadFile({ url: hostedUrl, file_name: fileName });
              showToast('Подтвердите сохранение в Telegram.', 4000);
              return;
            } catch (e) { /* fall through */ }
          }
          // 2b) Универсальный путь — открываем картинку в системном браузере,
          //     там тап-удержание / меню «Скачать» работают штатно.
          if (tg && typeof tg.openLink === 'function') {
            try {
              tg.openLink(hostedUrl);
              showToast('Сохраните картинку в открывшемся браузере.', 6000);
              return;
            } catch (e) { /* fall through */ }
          }
          // 2c) Не в Telegram — открываем в новой вкладке.
          window.open(hostedUrl, '_blank');
          showToast('Сохраните картинку в открывшейся вкладке.', 6000);
          return;
        }

        // 3) Хост не ответил (нет сети / CORS / даун) — фолбэк на blob+SW.
        const swUrl = await prepareSWDownload(blob, fileName);
        const fallbackUrl = swUrl || URL.createObjectURL(blob);
        showSaveOverlay(fallbackUrl, fileName, fallbackUrl);
        showToast('Хост загрузки недоступен — попробуйте долгим тапом.', 6000);
        return;
      }

      // 3) Desktop — обычное скачивание.
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Мем сохранён.', 2000);
    } catch (err) {
      console.error(err);
      showToast('Не удалось сохранить. Попробуйте ещё раз.', 4000);
    } finally {
      downloadBtn.disabled = false;
      downloadBtn.textContent = originalLabel;
    }
  }

  function showSaveOverlay(downloadUrl, fileName, previewUrl) {
    const overlay = document.createElement('div');
    overlay.style.cssText = `
      position: fixed; inset: 0; background: rgba(0,0,0,0.94);
      z-index: 200; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      padding:
        max(20px, env(safe-area-inset-top), var(--tg-top, 0px))
        max(20px, env(safe-area-inset-right), var(--tg-right, 0px))
        max(20px, env(safe-area-inset-bottom), var(--tg-bottom, 0px))
        max(20px, env(safe-area-inset-left), var(--tg-left, 0px));
    `;

    const im = document.createElement('img');
    im.src = previewUrl || downloadUrl;
    im.style.cssText = 'max-width: 100%; max-height: 55vh; border-radius: 8px; object-fit: contain;';
    overlay.appendChild(im);

    const actions = document.createElement('div');
    actions.style.cssText = 'display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 360px;';

    // Ссылка ведёт на SW-эндпоинт (или blob, если SW недоступен).
    // Ручной тап → доверенный жест → WebView передаёт в системный DownloadManager.
    const dl = document.createElement('a');
    dl.href = downloadUrl;
    dl.download = fileName;
    dl.textContent = 'Скачать в галерею';
    dl.style.cssText = `
      display: block; padding: 16px;
      background: #ffffff; color: #1a1a20;
      text-decoration: none; text-align: center;
      border-radius: 12px; font-weight: 700; font-size: 16px;
      -webkit-tap-highlight-color: rgba(0,0,0,0.1);
    `;
    actions.appendChild(dl);

    const close = document.createElement('button');
    close.type = 'button';
    close.textContent = 'Закрыть';
    close.style.cssText = `
      padding: 12px; background: transparent; color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px; font-size: 14px; cursor: pointer;
      font-family: inherit;
    `;
    close.addEventListener('click', () => {
      if (previewUrl && previewUrl !== downloadUrl) {
        try { URL.revokeObjectURL(previewUrl); } catch (e) {}
      }
      if (downloadUrl.startsWith('blob:')) {
        try { URL.revokeObjectURL(downloadUrl); } catch (e) {}
      }
      overlay.remove();
    });
    actions.appendChild(close);

    overlay.appendChild(actions);

    const hint = document.createElement('div');
    hint.textContent = 'Если ничего не происходит — удерживайте картинку → «Сохранить».';
    hint.style.cssText = 'color: rgba(255,255,255,0.65); font-size: 12px; text-align: center; padding: 0 16px; max-width: 360px;';
    overlay.appendChild(hint);

    document.body.appendChild(overlay);
  }

  downloadBtn.addEventListener('click', saveMeme);

  resetBtn.addEventListener('click', () => {
    img = null;
    canvas.style.display = 'none';
    placeholder.style.display = 'block';
    stage.classList.add('empty');
    topText.value = '';
    bottomText.value = '';
    fileInput.value = '';
    downloadBtn.disabled = true;
    resetBtn.disabled = true;
  });
})();
</script>
</body>
</html>
