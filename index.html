<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Генератор мемов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f5f5f7;
    --panel-2: #ebebef;
    --text: #1a1a20;
    --muted: #6b6b75;
    --accent: #1a1a20;
    --accent-hover: #2d2d35;
    --accent-text: #ffffff;
    --border: #e2e2e6;
    --stage-bg: #f0f0f3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    /* фон под safe-area, чтобы при overscroll/notch не было белой полосы */
    background: var(--bg);
    height: 100%;
    -webkit-text-size-adjust: 100%;
    /* manipulation = убирает двойной тап = зум, но оставляет pinch (a11y) */
    touch-action: manipulation;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: contain;
    touch-action: manipulation;
  }
  body {
    /* Safe-area на уровне body — нужна в Safari/обычном браузере, чтобы контент
       не залезал под чёлку / Dynamic Island / home-indicator.
       В Telegram эти insets обычно = 0, но close-button / меню Mini App
       на современных клиентах рендерятся ПОВЕРХ WebView, поэтому ниже
       для html.in-telegram добавляем гарантированный буфер. */
    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
  }
  /* Когда сайт открыт как Mini App — резервируем место под плавающие
     кнопки Telegram (close, меню) и берём максимум из всех источников. */
  html.in-telegram body {
    padding-top: max(env(safe-area-inset-top), var(--tg-top, 0px), 64px);
    padding-bottom: max(env(safe-area-inset-bottom), var(--tg-bottom, 0px), 12px);
  }
  /* На iOS плавающие кнопки сидят ниже из-за Dynamic Island / чёлки —
     сверху буфер больше. Снизу env(safe-area-inset-bottom) на iPhone
     уходит в ~34px под home-indicator, что визуально много — режем на 30%. */
  html.in-telegram.tg-ios body {
    padding-top: max(env(safe-area-inset-top), var(--tg-top, 0px), 100px);
    padding-bottom: max(calc(env(safe-area-inset-bottom) * 0.7), 8px);
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .sub {
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 14px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .wrap {
      padding: 16px 14px 40px;
    }
    h1 { font-size: 22px; }
    .sub { font-size: 13px; margin-bottom: 16px; }
    .canvas-card { padding: 12px; gap: 12px; }
    .canvas-stage { min-height: 260px; }
    .panel { padding: 14px; }
    textarea { font-size: 16px; }
    input[type="text"], input[type="number"] { font-size: 16px; }
    footer {
      margin-top: 24px;
      padding-bottom: env(safe-area-inset-bottom);
    }
  }
  /* Ландшафт — компактнее */
  @media (orientation: landscape) and (max-height: 500px) {
    .wrap { padding: 12px 14px; }
    h1 { font-size: 20px; margin-bottom: 0; }
    .sub { margin-bottom: 12px; }
  }
  .canvas-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .canvas-stage {
    width: 100%;
    background: var(--stage-bg);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 360px;
    position: relative;
  }
  .canvas-stage.empty {
    background:
      repeating-linear-gradient(
        45deg,
        #f0f0f3,
        #f0f0f3 10px,
        #e7e7eb 10px,
        #e7e7eb 20px
      );
    cursor: pointer;
    transition: background 0.15s;
  }
  .canvas-stage.empty:hover,
  .canvas-stage.empty.drag {
    background: #f7f7fa;
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
  }
  .placeholder {
    color: var(--muted);
    text-align: center;
    padding: 40px 20px;
    font-size: 14px;
    line-height: 1.5;
  }
  .placeholder strong {
    color: var(--text);
    display: block;
    font-size: 16px;
    margin-bottom: 8px;
  }
  canvas {
    max-width: 100%;
    height: auto;
    display: block;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  input[type="text"], input[type="number"], textarea {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
  }
  textarea {
    resize: vertical;
    min-height: 60px;
    font-family: Impact, "Anton", "Arial Black", sans-serif;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  input[type="range"] {
    width: 100%;
  }
  .btn {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled {
    background: var(--panel-2);
    color: var(--muted);
    cursor: not-allowed;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--accent); background: #fafafa; }
  .row {
    display: flex;
    gap: 10px;
  }
  .row > * { flex: 1; }
  .field-inline {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .field-inline input[type="range"] { flex: 1; }
  .value { color: var(--text); min-width: 36px; text-align: right; }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 30px;
  }
  footer a { color: var(--muted); }
  .version {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + max(env(safe-area-inset-bottom), var(--tg-bottom, 0px)));
    transform: translateX(-50%) translateY(20px);
    background: #1a1a20;
    color: #ffffff;
    border: 1px solid #1a1a20;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    max-width: calc(100% - 32px);
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Генератор мемов</h1>
  <div class="sub">Загрузите фото, добавьте текст сверху и снизу — скачайте готовый мем.</div>

  <div class="layout">
    <div class="canvas-card">
      <div class="canvas-stage empty" id="stage">
        <div class="placeholder" id="placeholder">
          <strong>Нажмите, чтобы загрузить фото</strong>
          или перетащите файл сюда
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
      </div>
      <div class="row" style="width:100%; max-width: 420px;">
        <button class="btn" id="downloadBtn" disabled>Скачать мем</button>
        <button class="btn btn-ghost" id="resetBtn" disabled>Сбросить</button>
      </div>
    </div>

    <div class="panel">
      <input type="file" id="fileInput" accept="image/*" style="display:none;">

      <label>
        Текст сверху
        <textarea id="topText" placeholder="ВЕРХНИЙ ТЕКСТ" rows="2"></textarea>
      </label>

      <label>
        Текст снизу
        <textarea id="bottomText" placeholder="НИЖНИЙ ТЕКСТ" rows="2"></textarea>
      </label>

      <div class="divider"></div>

      <div class="field-inline">
        <span>Размер</span>
        <input type="range" id="fontSize" min="20" max="120" value="56">
        <span class="value" id="fontSizeVal">56</span>
      </div>

      <div class="field-inline">
        <span>Обводка</span>
        <input type="range" id="strokeWidth" min="1" max="20" value="6">
        <span class="value" id="strokeWidthVal">6</span>
      </div>

      <label style="flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px;">
        <input type="checkbox" id="uppercase" checked>
        Заглавные буквы
      </label>
    </div>
  </div>

  <footer>
    Шрифт: Impact, белый с чёрной обводкой.
    <span class="version">v1.0.6</span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function() {
  // --- Telegram Mini App: разворачиваем на полный экран ---
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    // Маркируем <html>, чтобы CSS зарезервировал отступ под плавающие
    // кнопки Telegram (close, меню) которые наезжают поверх WebView.
    document.documentElement.classList.add('in-telegram');
    if (tg.platform) {
      document.documentElement.classList.add('tg-' + tg.platform);
    }

    try { tg.ready(); } catch (e) {}
    // expand() — занять всю доступную высоту (Bot API 6.1+).
    // Работает и при открытии из чата, и из списка чатов.
    try { tg.expand(); } catch (e) {}

    // disableVerticalSwipes() — Bot API 7.7+: блокирует свайп вниз,
    // которым по умолчанию можно свернуть/закрыть Mini App.
    if (typeof tg.disableVerticalSwipes === 'function') {
      try { tg.disableVerticalSwipes(); } catch (e) {}
    }

    // requestFullscreen() намеренно НЕ вызываем: в этом режиме close-button и
    // 3-точки Telegram наезжают на наш контент, а compensation через
    // contentSafeAreaInset работает только на Bot API 8.0+ (ноябрь 2024).
    // expand() даёт максимальную высоту, оставляя нативный хедер Telegram сверху —
    // это и есть надёжный «развернуть на весь экран».

    // Подгоняем цвета хедера/фона Telegram под страницу.
    try { tg.setHeaderColor && tg.setHeaderColor('#ffffff'); } catch (e) {}
    try { tg.setBackgroundColor && tg.setBackgroundColor('#ffffff'); } catch (e) {}

    // Если по какой-то причине вьюпорт «схлопнется» (юзер свайпнул, старый клиент) —
    // принудительно разворачиваем обратно.
    try {
      tg.onEvent && tg.onEvent('viewportChanged', (e) => {
        if (e && e.isStateStable && tg.isExpanded === false) {
          try { tg.expand(); } catch (err) {}
        }
      });
    } catch (e) {}

    // Telegram safe-area: на Android в fullscreen хедер с close-кнопкой и меню
    // перекрывает наш контент — компенсируем contentSafeAreaInset/safeAreaInset.
    // (Bot API 8.0+; на старых клиентах значения будут undefined → CSS использует 0.)
    function applyTgSafeArea() {
      const csa = (tg && tg.contentSafeAreaInset) || {};
      const sa  = (tg && tg.safeAreaInset) || {};
      const num = (v) => (typeof v === 'number' && !isNaN(v) ? v : 0);
      const top    = Math.max(num(csa.top),    num(sa.top));
      const bottom = Math.max(num(csa.bottom), num(sa.bottom));
      const left   = Math.max(num(csa.left),   num(sa.left));
      const right  = Math.max(num(csa.right),  num(sa.right));
      const r = document.documentElement.style;
      r.setProperty('--tg-top',    top    + 'px');
      r.setProperty('--tg-bottom', bottom + 'px');
      r.setProperty('--tg-left',   left   + 'px');
      r.setProperty('--tg-right',  right  + 'px');
    }
    applyTgSafeArea();
    ['safeAreaChanged','contentSafeAreaChanged','fullscreenChanged','viewportChanged'].forEach((ev) => {
      try { tg.onEvent && tg.onEvent(ev, applyTgSafeArea); } catch (e) {}
    });
  }

  const fileInput = document.getElementById('fileInput');
  const stage = document.getElementById('stage');
  const placeholder = document.getElementById('placeholder');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const topText = document.getElementById('topText');
  const bottomText = document.getElementById('bottomText');
  const fontSize = document.getElementById('fontSize');
  const fontSizeVal = document.getElementById('fontSizeVal');
  const strokeWidth = document.getElementById('strokeWidth');
  const strokeWidthVal = document.getElementById('strokeWidthVal');
  const uppercase = document.getElementById('uppercase');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');

  let img = null;

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('Пожалуйста, выберите файл изображения.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const newImg = new Image();
      newImg.onload = () => {
        img = newImg;
        const maxDim = 1200;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          const k = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * k);
          h = Math.round(h * k);
        }
        canvas.width = w;
        canvas.height = h;
        canvas.style.display = 'block';
        placeholder.style.display = 'none';
        stage.classList.remove('empty');
        downloadBtn.disabled = false;
        resetBtn.disabled = false;
        render();
      };
      newImg.onerror = () => alert('Не удалось загрузить изображение. Возможно, формат не поддерживается браузером (например, AVIF в старых браузерах).');
      newImg.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function wrapLines(text, maxWidth) {
    const words = text.split(/\s+/).filter(Boolean);
    const lines = [];
    let current = '';
    for (const w of words) {
      const test = current ? current + ' ' + w : w;
      if (ctx.measureText(test).width <= maxWidth) {
        current = test;
      } else {
        if (current) lines.push(current);
        if (ctx.measureText(w).width > maxWidth) {
          let chunk = '';
          for (const ch of w) {
            if (ctx.measureText(chunk + ch).width <= maxWidth) {
              chunk += ch;
            } else {
              if (chunk) lines.push(chunk);
              chunk = ch;
            }
          }
          current = chunk;
        } else {
          current = w;
        }
      }
    }
    if (current) lines.push(current);
    return lines;
  }

  function drawText(text, position) {
    if (!text) return;
    const value = uppercase.checked ? text.toUpperCase() : text;
    const size = parseInt(fontSize.value, 10);
    const stroke = parseInt(strokeWidth.value, 10);
    const sidePadding = Math.round(size * 0.3);
    const edgePadding = Math.round(size * 0.7);
    const maxWidth = canvas.width - sidePadding * 2;

    ctx.font = `${size}px Impact, "Anton", "Arial Black", "Helvetica Neue", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = position === 'top' ? 'top' : 'bottom';
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = stroke;
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;

    const lines = [];
    for (const line of value.split('\n')) {
      lines.push(...wrapLines(line, maxWidth));
    }

    const lineHeight = size * 1.05;
    const x = canvas.width / 2;
    if (position === 'top') {
      lines.forEach((line, i) => {
        const y = edgePadding + i * lineHeight;
        ctx.strokeText(line, x, y);
        ctx.fillText(line, x, y);
      });
    } else {
      const total = lines.length;
      lines.forEach((line, i) => {
        const y = canvas.height - edgePadding - (total - 1 - i) * lineHeight;
        ctx.strokeText(line, x, y);
        ctx.fillText(line, x, y);
      });
    }
  }

  function render() {
    if (!img) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    drawText(topText.value, 'top');
    drawText(bottomText.value, 'bottom');
  }

  fileInput.addEventListener('change', (e) => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });

  stage.addEventListener('click', () => {
    fileInput.click();
  });
  stage.addEventListener('dragover', (e) => {
    e.preventDefault();
    stage.classList.add('drag');
  });
  stage.addEventListener('dragleave', () => stage.classList.remove('drag'));
  stage.addEventListener('drop', (e) => {
    e.preventDefault();
    stage.classList.remove('drag');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  [topText, bottomText].forEach(el => el.addEventListener('input', render));
  [fontSize, strokeWidth].forEach(el => el.addEventListener('input', () => {
    fontSizeVal.textContent = fontSize.value;
    strokeWidthVal.textContent = strokeWidth.value;
    render();
  }));
  uppercase.addEventListener('change', render);

  // Перерисовываем после загрузки веб-шрифта Anton, чтобы canvas обновился,
  // если первый рендер прошёл с системным фолбэком.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { if (img) render(); });
  }

  const toast = document.getElementById('toast');
  let toastTimer = null;
  function showToast(text, ms = 4000) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), ms);
  }

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function isAndroid() {
    return /Android/i.test(navigator.userAgent);
  }
  function isMobile() {
    return isIOS() || isAndroid();
  }

  function canvasToBlob() {
    return new Promise((resolve, reject) => {
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png');
    });
  }

  async function saveMeme() {
    if (!img) return;
    const originalLabel = downloadBtn.textContent;
    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Готовим…';
    try {
      const blob = await canvasToBlob();
      const fileName = `meme-${Date.now()}.png`;
      const file = new File([blob], fileName, { type: 'image/png' });

      // 1) Web Share API с файлом — лучший путь на iOS/Android и в WebView Telegram:
      //    открывается нативная "шторка поделиться" → "Сохранить изображение" → Фото/Галерея.
      //    НЕ гейтим через canShare: в Android-WebView Telegram он часто возвращает false,
      //    хотя сам share() при этом отрабатывает корректно. Доверяем try/catch.
      if (navigator.share) {
        try {
          await navigator.share({ files: [file], title: 'Мем' });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return; // пользователь закрыл шторку
          // share не поддержан с файлами → падаем в фолбэк
        }
      }

      // 2) Мобильный фолбэк (iOS без Share API + Android-WebView Telegram, где
      //    атрибут download игнорируется и файл фактически никуда не сохраняется).
      //    Открываем картинку, чтобы пользователь долгим тапом сохранил в галерею.
      if (isMobile()) {
        const url = URL.createObjectURL(blob);
        let win = null;
        try { win = window.open(url, '_blank'); } catch (e) {}
        if (!win) {
          // попап заблокирован (типично для Telegram WebView) — показываем оверлей
          showImageOverlay(url);
        }
        showToast('Удерживайте картинку → «Сохранить в Фото» / «Загрузить изображение».', 6500);
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        return;
      }

      // 3) Desktop — обычное скачивание.
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Мем сохранён.', 2000);
    } catch (err) {
      console.error(err);
      showToast('Не удалось сохранить. Попробуйте ещё раз.', 4000);
    } finally {
      downloadBtn.disabled = false;
      downloadBtn.textContent = originalLabel;
    }
  }

  function showImageOverlay(url) {
    const overlay = document.createElement('div');
    overlay.style.cssText = `
      position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      padding:
        max(20px, env(safe-area-inset-top), var(--tg-top, 0px))
        max(20px, env(safe-area-inset-right), var(--tg-right, 0px))
        max(20px, env(safe-area-inset-bottom), var(--tg-bottom, 0px))
        max(20px, env(safe-area-inset-left), var(--tg-left, 0px));
      cursor: pointer;
    `;
    const im = document.createElement('img');
    im.src = url;
    im.style.cssText = 'max-width: 100%; max-height: 100%; border-radius: 8px;';
    const hint = document.createElement('div');
    hint.textContent = 'Удерживайте картинку → «Сохранить в Фото» / «Загрузить изображение». Тап вне — закрыть.';
    hint.style.cssText = `
      position: absolute; left: 0; right: 0;
      bottom: calc(12px + max(env(safe-area-inset-bottom), var(--tg-bottom, 0px)));
      text-align: center; color: #fff; font-size: 13px;
      padding: 0 16px;
    `;
    overlay.appendChild(im);
    overlay.appendChild(hint);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) document.body.removeChild(overlay);
    });
    document.body.appendChild(overlay);
  }

  downloadBtn.addEventListener('click', saveMeme);

  resetBtn.addEventListener('click', () => {
    img = null;
    canvas.style.display = 'none';
    placeholder.style.display = 'block';
    stage.classList.add('empty');
    topText.value = '';
    bottomText.value = '';
    fileInput.value = '';
    downloadBtn.disabled = true;
    resetBtn.disabled = true;
  });
})();
</script>
</body>
</html>
